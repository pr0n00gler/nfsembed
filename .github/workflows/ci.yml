name: nfsembed CI

on:
  push:
    branches:
      - main
      - feat/refactoring
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt
      - name: Format
        run: |
          cargo +nightly fmt --manifest-path ./Cargo.toml --all -- --check

  build_and_test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install Rust 1.96 as the default gate toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
      - name: Install fuzz runner
        run: cargo install cargo-fuzz --locked
      - name: Full repository gate
        run: ./tests/run_ci.sh
      - name: Check Cargo.lock has no uncommitted changes
        run: |
          # the build and test steps would update Cargo.lock if it is out of date
          test -z "$(git status --porcelain Cargo.lock)" || (echo "Cargo.lock has uncommitted changes!" && exit 1)

  build_and_test-windows:
    name: Windows x64 MSVC tests and ARM64 compile
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.96 MSVC toolchains
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy,rustfmt
          targets: aarch64-pc-windows-msvc
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Test (default features)
        run: cargo test --all-targets
      - name: Test (all features)
        run: cargo test --all-features --all-targets
      - name: Configure the MSVC ARM64 cross compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Compile all targets for Windows ARM64
        run: cargo check --all-features --all-targets --target aarch64-pc-windows-msvc
