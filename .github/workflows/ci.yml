name: nfsserve CI

on:
  push:
    branches:
      - main
      - feat/refactoring
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt
      - name: Format
        run: |
          cargo +nightly fmt --manifest-path ./Cargo.toml --all -- --check

  build_and_test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install Rust 1.90 as the default gate toolchain
        uses: dtolnay/rust-toolchain@1.90
        with:
          components: clippy,rustfmt
      - name: Install fuzz runner
        run: cargo install cargo-fuzz --locked
      - name: Full repository gate
        run: ./tests/run_ci.sh
      - name: Check Cargo.lock has no uncommitted changes
        run: |
          # the build and test steps would update Cargo.lock if it is out of date
          test -z "$(git status --porcelain Cargo.lock)" || (echo "Cargo.lock has uncommitted changes!" && exit 1)
