name: Native NFSv3 clients

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/refactoring

jobs:
  same-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nfs-common python3
      - run: ./tests/native/run_local.sh

  windows-client:
    name: Windows Server Client for NFS
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Microsoft Client for NFS
        shell: powershell
        run: |
          Install-WindowsFeature -Name NFS-Client
          Set-Service -Name NfsClnt -StartupType Automatic
          Start-Service -Name NfsClnt
      - name: Run native Windows certification
        shell: powershell
        run: ./tests/native/run_windows.ps1
