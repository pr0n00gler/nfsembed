[logging]
    kdc = STDERR

[kdc]
    addresses = 0.0.0.0
    encode_as_rep_as_tgs_rep = false
    ports = 88
    require-preauth = true
    database = {
        acl_file = /etc/krb5kdc/kadm5.acl
        dbname = /var/lib/krb5kdc/heimdal
        mkey_file = /var/lib/krb5kdc/m-key
        realm = NFSEMBED.TEST
    }
