[libdefaults]
    default_realm = NFSEMBED.TEST
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    ticket_lifetime = 1h
    renew_lifetime = 2h
    forwardable = true

[logging]
    kdc = FILE:/dev/stderr

[realms]
    NFSEMBED.TEST = {
        kdc = kdc:88
        admin_server = kdc:749
    }

[domain_realm]
    .nfsembed.test = NFSEMBED.TEST
    nfsembed.test = NFSEMBED.TEST
